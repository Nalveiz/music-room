<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >
    <title>Reset Password</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f8fa;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 90%;
            max-width: 400px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.1);
        }

        h2 {
            margin-bottom: 24px;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 24px;
            padding: 13px;
            border: none;
            border-radius: 6px;
            background: #007AFF;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        #message {
            margin-top: 16px;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Reset your password</h2>

    <form id="resetForm">

        <label for="password">
            New password
        </label>

        <input
            id="password"
            type="password"
            required
        >

        <label for="confirmPassword">
            Confirm password
        </label>

        <input
            id="confirmPassword"
            type="password"
            required
        >

        <button type="submit">
            Reset Password
        </button>

    </form>

    <div id="message"></div>

</div>

<script>
    const token = "{{RESET_TOKEN}}";

    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", async (event) => {

        event.preventDefault();

        const password =
            document.getElementById("password").value;

        const confirmPassword =
            document.getElementById("confirmPassword").value;

        if (password !== confirmPassword) {
            message.innerHTML =
                "<p style='color:red'>Passwords do not match.</p>";

            return;
        }

        try {

            const response = await fetch(
                "/reset?token=" + encodeURIComponent(token),
                {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        new_password: password
                    })
                }
            );

            const data = await response.json();

            if (!response.ok) {
                message.innerHTML =
                    "<p style='color:red'>" +
                    (data.message || "Password reset failed.") +
                    "</p>";

                return;
            }

            document.querySelector(".container").innerHTML = `
                <h2>Password changed successfully</h2>

                <p>
                    Your password has been updated successfully.
                </p>

                <a
                    href="musicroom://"
                    style="
                        display:inline-block;
                        width:100%;
                        box-sizing:border-box;
                        text-align:center;
                        padding:13px;
                        background:#007AFF;
                        color:white;
                        text-decoration:none;
                        border-radius:6px;
                        margin-top:20px;
                    "
                >
                    Open Music Room
                </a>
            `;

        } catch (error) {

            message.innerHTML =
                "<p style='color:red'>Something went wrong.</p>";

        }
    });
</script>

</body>
</html>
